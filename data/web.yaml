# Web project showcase — drives /work/
# Sibling of data/apps.yaml: apps live on /apps/, everything else lives here.
#
# Thumbnails: static/images/web/<slug>.jpg, 2:1, 1280x640, JPEG q80.
# Capture one with:
#   "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
#     --headless --disable-gpu --hide-scrollbars --virtual-time-budget=6000 \
#     --window-size=1600,800 --screenshot=out.png https://example.com
#   sips -Z 1280 out.png && sips -s format jpeg -s formatOptions 80 out.png --out out.jpg
# A missing thumbnail is fine — the card falls back to a typographic tile.
#
# Fields: slug, name, client, year, url required. sector, tagline, note optional.
#
# After editing this file, bump `date:` in content/work/_index.md. The sitemap's
# <lastmod> comes from that frontmatter date, and it is what the IndexNow
# workflow diffs against — a change here alone renders a new /work/ page that
# search engines are never told about.

sites:
  - slug: smartbyg
    name: "SmartByg"
    client: "SmartByg"
    year: 2026
    sector: "Construction"
    url: "https://smartbyg.dk"
    tagline: "Do-it-yourself construction, properly supported — priced material lists, carpenter consultation and tool rental, from first idea to finished terrace."

  - slug: billederapport
    name: "Billederapport"
    year: 2026
    sector: "Trades & inspection"
    url: "https://billederapport.dk"
    note: "12F product"
    tagline: "A finished photo report on the phone before you leave the customer — mark up the photos, run the checklist, send a branded PDF. Works with no signal."

  - slug: vinnie-davida-sondergaard
    name: "Vinnie Davida Søndergaard"
    client: "Vinnie Davida Søndergaard"
    year: 2026
    sector: "Health & performance"
    url: "https://vinnie-davida-sondergaard.dk"
    tagline: "One practice, three ways in — body treatment at the Østerbro clinic, outdoor TRX training by the water, and People & Performance consulting for organisations."
